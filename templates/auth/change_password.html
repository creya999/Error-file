{% extends 'base.html' %}
{% block title %}Change Password – ADBL{% endblock %}

{% block content %}
<div class="page-header">
  <h4><i class="bi bi-shield-lock me-2"></i>Change Password</h4>
</div>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-semibold text-success">
        <i class="bi bi-key me-2"></i>Update Your Password
      </div>
      <div class="card-body p-4">
        <div class="alert alert-success py-2 small mb-4">
          <i class="bi bi-person-circle me-1"></i>
          Logged in as <strong>{{ current_user.full_name }}</strong>
          &nbsp;|&nbsp; Staff ID: <strong>{{ current_user.staff_id }}</strong>
        </div>

        <form method="POST" action="{{ url_for('auth.change_password') }}">

          <div class="mb-3">
            <label class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="current_password" id="currentPwd"
                     class="form-control" placeholder="Enter current password" required/>
              <button class="btn btn-outline-secondary" type="button"
                      onclick="toggleVis('currentPwd','eye1')">
                <i class="bi bi-eye" id="eye1"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="new_password" id="newPwd"
                     class="form-control" placeholder="Min. 6 characters" required minlength="6"/>
              <button class="btn btn-outline-secondary" type="button"
                      onclick="toggleVis('newPwd','eye2')">
                <i class="bi bi-eye" id="eye2"></i>
              </button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="confirm_password" id="confirmPwd"
                     class="form-control" placeholder="Re-type new password" required minlength="6"/>
              <button class="btn btn-outline-secondary" type="button"
                      onclick="toggleVis('confirmPwd','eye3')">
                <i class="bi bi-eye" id="eye3"></i>
              </button>
            </div>
            <div id="matchMsg" class="form-text mt-1"></div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-adbl py-2" id="submitBtn">
              <i class="bi bi-shield-check me-1"></i>Change Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleVis(inputId, iconId){
  const input = document.getElementById(inputId);
  const icon  = document.getElementById(iconId);
  if(input.type === 'password'){ input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; icon.className = 'bi bi-eye'; }
}

function checkMatch(){
  const p1  = document.getElementById('newPwd').value;
  const p2  = document.getElementById('confirmPwd').value;
  const msg = document.getElementById('matchMsg');
  const btn = document.getElementById('submitBtn');
  if(p2.length === 0){ msg.textContent = ''; btn.disabled = false; return; }
  if(p1 === p2){
    msg.textContent = '✓ Passwords match';
    msg.className = 'form-text text-success fw-semibold';
    btn.disabled = false;
  } else {
    msg.textContent = '✗ Passwords do not match';
    msg.className = 'form-text text-danger fw-semibold';
    btn.disabled = true;
  }
}
document.getElementById('newPwd').addEventListener('input', checkMatch);
document.getElementById('confirmPwd').addEventListener('input', checkMatch);
</script>
{% endblock %}
